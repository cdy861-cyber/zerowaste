<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5학년 제로 웨이스트 활동 게시판</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#eaf4ee;min-height:100vh}
.hero{background:linear-gradient(160deg,#1b5e3b 0%,#2d7d52 50%,#52b788 100%);padding:2.2rem 1rem 2.8rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.07) 1px,transparent 1px);background-size:30px 30px}
.hero-icon{font-size:3rem;display:block;margin-bottom:.4rem}
.hero h1{color:#fff;font-size:1.55rem;font-weight:800;line-height:1.35;position:relative}
.hero p{color:rgba(255,255,255,.85);font-size:.88rem;margin-top:.4rem;position:relative}
.leaf1,.leaf2{position:absolute;font-size:2rem;opacity:.25}
.leaf1{top:12px;right:18px}
.leaf2{bottom:18px;left:14px;font-size:1.6rem}
.loading-overlay{position:fixed;inset:0;background:rgba(27,94,59,0.92);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.loading-overlay.hide{display:none}
.loading-spinner{width:48px;height:48px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{font-size:1rem;font-weight:700}
.stats-row{display:flex;gap:8px;padding:.8rem 1rem .4rem;justify-content:center;flex-wrap:wrap}
.stat-chip{background:#fff;border:1.5px solid #b7e4c7;border-radius:30px;padding:.28rem .85rem;font-size:.73rem;color:#2d6a4f;font-weight:700}
.class-tabs{display:flex;gap:8px;padding:.6rem 1rem;justify-content:center}
.class-tab{flex:1;max-width:140px;background:#fff;border:2px solid #d8f3dc;border-radius:18px;padding:.65rem .5rem;cursor:pointer;text-align:center;transition:all .18s;-webkit-tap-highlight-color:transparent}
.class-tab:hover{border-color:#52b788;transform:translateY(-2px)}
.class-tab.active{border-color:#1b5e3b;background:#d8f3dc}
.class-tab img{width:50px;height:50px;object-fit:contain;display:block;margin:0 auto 4px}
.class-tab .tab-name{font-size:.75rem;font-weight:800;color:#1b5e3b}
.class-tab .tab-count{font-size:.66rem;color:#52b788;margin-top:1px}
.board{padding:.4rem 1rem 2rem}
.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.board-title{font-size:1rem;font-weight:800;color:#1b4332;display:flex;align-items:center;gap:6px}
.cnt-badge{background:#d8f3dc;color:#2d6a4f;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:20px}
.upload-box{border:2.5px dashed #52b788;border-radius:16px;background:rgba(255,255,255,.75);padding:1rem;margin-bottom:.6rem;cursor:pointer;transition:all .18s;text-align:center}
.upload-box:hover{background:#d8f3dc;border-color:#1b5e3b}
.upload-box input{display:none}
.ub-icon{font-size:1.7rem;margin-bottom:3px}
.ub-text{font-size:.83rem;color:#2d6a4f;font-weight:700}
.ub-sub{font-size:.7rem;color:#74c69d;margin-top:2px}
.input-row{display:flex;gap:7px;margin-bottom:.6rem}
.input-row input{flex:1;border:1.5px solid #b7e4c7;border-radius:10px;padding:.45rem .75rem;font-size:.82rem;font-family:inherit;background:#fff;color:#1b4332;outline:none;transition:border-color .15s}
.input-row input:focus{border-color:#2d6a4f}
.input-row input::placeholder{color:#95d5b2}
.submit-btn{background:#1b5e3b;color:#fff;border:none;border-radius:10px;padding:0 1.1rem;font-size:.82rem;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background .15s}
.submit-btn:hover{background:#163d28}
.submit-btn:disabled{background:#b7e4c7;cursor:not-allowed}
.preview-strip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;border:1.5px solid #b7e4c7;padding:.5rem .7rem;margin-bottom:.6rem}
.preview-strip img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.ps-name{font-size:.78rem;color:#1b5e3b;flex:1;font-weight:600}
.ps-del{background:none;border:none;font-size:1.1rem;cursor:pointer;color:#95d5b2;padding:0 2px;line-height:1}
.ps-del:hover{color:#c0392b}
.photos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo-card{background:#fff;border-radius:14px;overflow:hidden;border:1.5px solid #d8f3dc;position:relative}
.photo-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.pc-info{padding:.45rem .55rem .5rem}
.pc-name{font-size:.76rem;font-weight:800;color:#1b5e3b}
.pc-time{font-size:.64rem;color:#95d5b2;margin-top:1px}
.pc-del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;color:#c0392b;opacity:0;transition:opacity .15s}
.photo-card:hover .pc-del{opacity:1}
.empty{text-align:center;padding:2.5rem 1rem;color:#95d5b2}
.empty span{font-size:2.5rem;display:block;margin-bottom:.5rem}
.empty p{font-size:.82rem}
.fs-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;padding:1rem}
.fs-overlay.show{display:flex}
.fs-overlay img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain}
.fs-name{color:rgba(255,255,255,.9);font-size:.88rem;margin-top:10px;font-weight:700}
.fs-close{color:#fff;background:rgba(255,255,255,.18);border:none;border-radius:50%;width:38px;height:38px;font-size:1.3rem;cursor:pointer;margin-top:12px;font-family:inherit;line-height:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b5e3b;color:#fff;padding:.55rem 1.3rem;border-radius:30px;font-size:.82rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;z-index:300}
.toast.show{opacity:1}
.uploading{position:fixed;inset:0;background:rgba(27,94,59,0.7);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.uploading.show{display:flex}
.uploading .spin{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:.7rem}
.uploading p{font-size:.9rem;font-weight:700}
</style>
</head>
<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCw7Y9U9Q3iJ6f2jphgo-956gli40QRORs",
  authDomain: "waste-26d6a.firebaseapp.com",
  projectId: "waste-26d6a",
  storageBucket: "waste-26d6a.firebasestorage.app",
  messagingSenderId: "1071224992748",
  appId: "1:1071224992748:web:719907ae58784d1a6bc6c9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLASSES = ['단무지반','영화반','오삼불고기반'];
const ICONS = ['🥒','🎬','🐷'];
let currentClass = 0;
let selectedDataUrl = null;
let unsubscribes = [null, null, null];
let photoCounts = [0, 0, 0];
let currentPhotos = [];

function formatTime(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function updateStats() {
  const total = photoCounts.reduce((a,b) => a+b, 0);
  document.getElementById('statsRow').innerHTML =
    `<div class="stat-chip">📷 전체 사진 ${total}장</div>` +
    CLASSES.map((c,i) => `<div class="stat-chip">${ICONS[i]} ${c} ${photoCounts[i]}장</div>`).join('');
  CLASSES.forEach((_,i) => {
    document.getElementById('cnt'+i).textContent = '사진 ' + photoCounts[i] + '장';
  });
  document.getElementById('cntBadge').textContent = photoCounts[currentClass] + '장';
}

function renderPhotos(photos) {
  currentPhotos = photos;
  const grid = document.getElementById('photosGrid');
  const empty = document.getElementById('emptyMsg');
  if (photos.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = photos.map((p,i) => `
      <div class="photo-card">
        <img src="${p.src}" alt="${p.name}" onclick="openFull('${p.src}','${p.name}')">
        <div class="pc-info">
          <div class="pc-name">${p.name}</div>
          <div class="pc-time">${formatTime(p.ts)}</div>
        </div>
        <button class="pc-del" onclick="deletePhoto('${p.id}')" title="삭제">🗑</button>
      </div>
    `).join('');
  }
  photoCounts[currentClass] = photos.length;
  updateStats();
}

function subscribeClass(cls) {
  if (unsubscribes[cls]) unsubscribes[cls]();
  const colRef = collection(db, 'class_' + cls);
  const q = query(colRef, orderBy('ts', 'desc'));
  unsubscribes[cls] = onSnapshot(q, (snap) => {
    const photos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    photoCounts[cls] = photos.length;
    if (cls === currentClass) renderPhotos(photos);
    else updateStats();
    if (cls === 0) document.getElementById('loadingOverlay').classList.add('hide');
  }, (err) => {
    console.error(err);
    document.getElementById('loadingOverlay').classList.add('hide');
    showToast('⚠️ 연결 오류! 새로고침 해주세요.');
  });
}

window.switchClass = function(idx) {
  currentClass = idx;
  document.querySelectorAll('.class-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.getElementById('boardTitle').textContent = ICONS[idx] + ' ' + CLASSES[idx] + ' 활동 사진';
  resetUpload();
  // Re-subscribe to current class
  subscribeClass(idx);
};

window.onFileSelect = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    // Compress
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX/w); w = MAX; }
        else { w = Math.round(w * MAX/h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      selectedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('previewArea').innerHTML = `
        <div class="preview-strip">
          <img src="${selectedDataUrl}" alt="미리보기">
          <span class="ps-name">${file.name}</span>
          <button class="ps-del" onclick="resetUpload()">✕</button>
        </div>`;
      document.getElementById('submitBtn').disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

function resetUpload() {
  selectedDataUrl = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('previewArea').innerHTML = '';
  document.getElementById('submitBtn').disabled = true;
}
window.resetUpload = resetUpload;

window.uploadPhoto = async function() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('이름을 입력해주세요!'); return; }
  if (!selectedDataUrl) { showToast('사진을 선택해주세요!'); return; }

  document.getElementById('uploadingOverlay').classList.add('show');
  document.getElementById('submitBtn').disabled = true;

  try {
    await addDoc(collection(db, 'class_' + currentClass), {
      src: selectedDataUrl,
      name: name,
      ts: Date.now()
    });
    document.getElementById('nameInput').value = '';
    resetUpload();
    showToast('✅ 사진이 등록되었어요!');
  } catch(e) {
    console.error(e);
    showToast('❌ 오류가 발생했어요. 다시 시도해주세요.');
    document.getElementById('submitBtn').disabled = false;
  } finally {
    document.getElementById('uploadingOverlay').classList.remove('show');
  }
};

window.deletePhoto = async function(id) {
  if (!confirm('이 사진을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, 'class_' + currentClass, id));
    showToast('🗑 사진이 삭제되었어요.');
  } catch(e) {
    showToast('❌ 삭제 오류!');
  }
};

window.openFull = function(src, name) {
  document.getElementById('fsImg').src = src;
  document.getElementById('fsName').textContent = name + '의 제로 웨이스트 활동';
  document.getElementById('fsOverlay').classList.add('show');
};
window.closeFull = function(e) {
  if (e === null || e.target === document.getElementById('fsOverlay'))
    document.getElementById('fsOverlay').classList.remove('show');
};

let toastTimer;
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

// Init - subscribe all 3 classes for counts, focus on current
subscribeClass(0);
subscribeClass(1);
subscribeClass(2);
</script>
</body>
